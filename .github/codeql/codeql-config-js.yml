# Custom CodeQL Configuration (JavaScript/TypeScript only)
name: "GH-500 Custom CodeQL Config (JS/TS)"

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

paths:
  - backend
  - frontend

paths-ignore:
  - tests
  - "**/*.test.js"
  - node_modules
  - "**/__pycache__"
