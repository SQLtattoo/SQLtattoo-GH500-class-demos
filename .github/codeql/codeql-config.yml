# Custom CodeQL Configuration — Demo 6.2
name: "GH-500 Custom CodeQL Config"

# Keep default queries and add security-extended
disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality
  - uses: ./custom-queries

paths:
  - backend
  - frontend

paths-ignore:
  - tests
  - "**/*.test.js"
  - node_modules
  - "**/__pycache__"
